# Workflow for deploying static content to GitHub Pages via gh-pages branch
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Permissions required to push build output to gh-pages branch
permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/synthscore-wasm

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126

      - name: Install dependencies
        run: npm ci

      - name: Download Soundfonts
        run: |
          mkdir -p public/presets/instruments
          for file in Crisis_GM_0-39.sf3 Crisis_GM_40-79.sf3 Crisis_GM_80-111.sf3 Crisis_GM_112-127_Drums.sf3; do
            curl -L -f -s -o public/presets/instruments/$file https://github.com/thichuong/SynthScore/releases/download/v1.0.0/$file || echo "Bỏ qua $file"
          done

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
